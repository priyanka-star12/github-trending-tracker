```yaml
name: GitHub Trending Tracker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python -m pip install PyYAML

      - name: Validate configuration
        run: python -c "import yaml; yaml.safe_load(open('config/config.yaml', encoding='utf-8')); print('Configuration is valid!')"

      - name: Check Python syntax
        run: |
          python -c "import ast; from pathlib import Path; files = [p for p in [Path('main.py'), *Path('config/test/src').rglob('*.py')] if p.is_file()]; [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for p in files]; print(f'All {len(files)} Python files have valid syntax!')"
```
