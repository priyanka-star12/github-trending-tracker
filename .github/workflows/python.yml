
name: GitHub Trending Tracker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python -m pip install PyYAML

      - name: Validate configuration
        run: python -c "import yaml; yaml.safe_load(open('config/config.yaml')); print('Configuration is valid!')"

      - name: Check Python syntax
        run: python -m compileall -q main.py config/test/src

