
name: GitHub Trending Tracker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML flake8 pytest

      - name: Validate configuration
        run: python -c "import yaml; yaml.safe_load(open('config/config.yaml', encoding='utf-8'))"

      - name: Check Python syntax
        run: python -m compileall -q main.py config/test/src

      - name: Check Python errors
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
